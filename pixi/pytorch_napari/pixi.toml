[workspace]
name = "pytorch_napari"
description = "Host environment for ND AI Lab: napari, Qt, torch and Cellpose. Nothing else."
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]
version = "0.1.0"

# This is the *host* environment -- the one napari-ai-lab itself runs in. It is
# deliberately the smallest thing that runs the app with one working global
# segmenter, and it exists because the older hosts could not be moved forward.
#
# What is NOT here, and why:
#
#   micro_sam           depends on `napari >=0.5,<0.6` outright, which pins the
#                       whole application a napari major version back
#   segment-everything  pins `onnxsim==0.4.36`, which has no wheel past cp311,
#                       so it pins Python at 3.11 as well
#   StarDist            TensorFlow, which constrains everything around it
#   monai               not needed to run the app
#
# Those stacks are not gone; they move to scikit-ops, which builds and runs
# them in their own environments on first use. That is the entire argument of
# docs/spec/0001-what-moves-to-scikit-ops.md, and dropping them from the host
# is what buys Python 3.12 and napari 0.8 -- the latter being roughly 4-5x
# faster at sequence switching (benchmarks/bench_sequence_switch.py).
#
# Expect most segmenters to report their dependencies as missing here. That is
# the design, not a broken environment: see
# docs/spec/0003-optional-dependencies.md. Cellpose should report available.

[system-requirements]
cuda = "12.0"

[dependencies]
python = "3.12.*"
torchvision = "*"
ipykernel = "<7"  # napari-console requires <7; a bare "*" grabs 7.x and fails to solve

# NB: cellpose is deliberately NOT here, though conda-forge has it and
# scikit-ops' envs/pytorch installs it that way. Conda's cellpose is a noarch
# package, so it installs the original PyPI dist-info, which declares
#
#     Requires-Dist: opencv-python-headless
#
# uv reads that and cannot tell that conda's `py-opencv` already provides
# `cv2` -- the distribution names do not match -- so it installs the PyPI
# opencv wheel on top of the conda one. Two cv2 implementations then compete,
# and the loser resolves libgobject-2.0.so.0 out of the other's install:
#
#     ImportError: .../cv2/.../libgobject-2.0.so.0: undefined symbol:
#     g_pointer_bit_unlock_and_set
#
# That surfaces as `import cellpose` failing *only after* napari is imported,
# which CellposeSegmenter's try/except turns into "dependencies not
# available" -- a confusing symptom for a package that is installed twice.
#
# Conda's opencv is also a qt6 build, which puts a second Qt in an
# environment running PyQt5. Taking cellpose from PyPI avoids both.

[pypi-dependencies]
# Pinned rather than left open, because the point of this environment is to be
# on 0.8 specifically. If a conda dependency above turns out to want an older
# napari, this pin makes it fail at solve time rather than silently downgrading
# the thing we came here for.
napari = "==0.8.0"
PyQt5 = "*"

# From PyPI rather than conda -- see the note in [dependencies] above. Torch
# stays on conda, where the CUDA builds are; cellpose finds it there.
cellpose = ">=4"

# AlbumentationsAugmenter's dependency, and the one model stack this host does
# install. It earns that because it is not a stack: no CUDA, no python pin, no
# hard numpy ceiling, and cellpose already brings opencv-python-headless,
# scipy and pydantic here -- so it costs albucore and two small wheels. The
# alternative was an appose round trip per patch, and augmentation runs
# thousands of times per session.
#
# PyPI rather than conda for the same reason as cellpose above, and more so:
# conda's albumentations pulls `py-opencv`, which is the qt6 build, which puts
# a second Qt next to PyQt5 and a second cv2 next to the PyPI one.
albumentations = "*"

napari-ai-lab = { path = "../../../napari-ai-lab", editable=true}

# scikit-ops, declared here directly so `editable = true` is actually applied.
#
# It used to come in through skop-napari's own [tool.uv.sources] instead, and
# declaring it here as well produced:
#
#     Requirements contain conflicting URLs for package `scikit-ops`:
#       - file:///.../scikit-ops
#       - file:///.../scikit-ops (editable)
#
# Both declarations said editable = true; uv drops that flag when applying a
# path dependency's sources transitively, so the two differed and collided.
# Relying on skop-napari's alone then gave a *copy* in site-packages, and edits
# to the checkout were invisible until someone reinstalled it by hand.
#
# skop-napari is no longer a dependency of this environment at all -- nothing
# in napari-ai-lab imports it since 7b36e20 removed the generated parameter
# form -- so there is only one declaration left and no conflict to have. Add
# it back and this collision returns; declare scikit-ops in exactly one place.
scikit-ops = { path = "../../../scikit-ops", editable = true }

# appose comes from the sibling checkout, which is ahead of the 0.12.0 release.
#
# It used to be left undeclared, on the grounds that skop-napari's
# [tool.uv.sources] supplies it from ../appose-python and a second declaration
# here made the solve unsatisfiable. That holds only while the lock is reused.
# Adding any new pypi dependency forces a full re-resolve, and in a full
# re-resolve uv does not apply a path dependency's sources transitively --
# appose silently reverts to the PyPI wheel. Adding albumentations below is
# what tripped it. Reproduce by deleting this line and adding any pypi
# package: `grep -c appose-python pixi.lock` goes from 4 to 0.
#
# Naming it here is worth doing whichever appose is wanted: a dependency
# changing source as a side effect of an unrelated edit is invisible at
# runtime and survives into the lock.
#
# The reason previously given for preferring a checkout was PixiInstallMonitor,
# absent from 0.11/0.12 and needed so that an environment build is not a silent
# multi-minute hang. That rationale is stale: the symbol is not in the checkout
# either. It landed in 3e97f55, which is an ancestor of the checkout's HEAD, so
# it was removed or renamed upstream afterwards. Whether build progress still
# reports, and under what name, is unresolved -- see docs/spec/OPEN.md.
appose = { path = "../../../appose-python", editable = true }


# Deliberately absent: zarr. The app must run without it (docs/spec/0003).
# albumentations used to be listed here too; it is now installed above, and
# `pixi/sandbox` is the environment that carries the minimal-tier promise
# (0003 names it as such). The app still runs without albumentations -- the
# augmenter registers either way and reports its dependencies in the banner.
#
# NB: this environment is for development, and assumes four sibling checkouts
# -- napari-ai-lab, scikit-ops, skop-napari, appose-python -- because two of
# them are pulled in by skop-napari's own [tool.uv.sources] as relative paths.
# That is not an install a user can be asked to perform. Before release,
# scikit-ops, skop-napari and appose need to be reachable by version or by
# git URL, and this file needs a variant that names them that way while the
# source-tree version stays for development. See docs/spec/0004.

[target.linux-64.dependencies]
pytorch-gpu = "*"
cudnn = "*"
cuda-version = "12.2"

[target.win-64.dependencies]
pytorch-gpu = "*"
cudnn = "*"

[target.osx-arm64.dependencies]
pytorch = "*"

[tasks]
lab = "python ../../src/launch_nd_ai_lab.py"
lab-stacked = "python ../../src/launch_nd_ai_lab.py --stacked"
lab-sequence = "python ../../src/launch_nd_ai_lab.py --sequence"
poc = "python ../../experiments/skop_stardist_poc.py"

# Register the environment as a Jupyter kernel for use in VS Code and Jupyter
register-kernel = "python -m ipykernel install --user --name=pytorch_napari --display-name 'AI-LAB (pytorch_napari)'"
