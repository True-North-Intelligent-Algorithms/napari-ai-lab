name: napari-ai-lab
display_name: Napari AI Lab
# use 'hidden' to remove plugin from napari hub search results
visibility: hidden
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
# categories: []
contributions:
  # One entry per profile. The profile decides which segmenters and augmenters
  # register and which parts of the GUI appear -- see apps/profiles.py. Adding
  # one means a subclass in apps/nd_ai_lab_plugin.py plus a command and widget
  # here.
  commands:
    - id: napari-ai-lab.nd_ai_lab
      python_name: napari_ai_lab.apps.nd_ai_lab_plugin:NDAILabPlugin
      title: ND AI Lab
    - id: napari-ai-lab.nd_ai_lab_instance_2d
      python_name: napari_ai_lab.apps.nd_ai_lab_plugin:NDAILabInstance2D
      title: 2D Instance AI Lab
  widgets:
    - command: napari-ai-lab.nd_ai_lab
      display_name: ND AI Lab
    - command: napari-ai-lab.nd_ai_lab_instance_2d
      display_name: 2D Instance AI Lab
