site_name: napari-ai-lab
docs_dir: docs/user
repo_url: https://github.com/True-North-Intelligent-Algorithms/napari-ai-lab
theme:
  name: material
  palette:
    scheme: default
    primary: blue
  features:
    - navigation.instant
    - search.highlight
    - content.code.annotate

nav:
  - Home: index.md
  - Install: 10-install.md
  - Get data: 20-get-data.md
  - Launch: 30-launch.md
  - 2D Instance:
      - Segment: instance/10-segment.md
      - Label: instance/20-label.md
      - Augment: instance/30-augment.md
      - Train: instance/40-train.md
  - 2D Detect: detect/index.md
  - Troubleshooting: 90-troubleshooting.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.emoji

extra:
  generator: false
